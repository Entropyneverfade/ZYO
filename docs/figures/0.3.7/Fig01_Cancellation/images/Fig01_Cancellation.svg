   <text style="font-size: 8px; font-family: 'SimSun'; text-anchor: middle" x="269.291339" y="254.88" transform="rotate(-0 269.291339 254.88)">r_i = x_i - d_i s; s = 1.23456789012345. 两行各自的存储值及十六进制表示见源 CSV。</text>
